<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعرّفي على نهى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #191530;
    --bg-deep: #120F24;
    --surface: #251F42;
    --surface-alt: #2F2752;
    --line: #3A3163;
    --gold: #FFFFCC;
    --gold-soft: #FFF6A8;
    --teal: #4FC1B0;
    --text: #F4F1FA;
    --text-muted: #ADA3C9;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 15% -10%, #2A2350 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #23325A 0%, transparent 55%),
      var(--bg);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:520px;
    height:min(760px, 92vh);
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:28px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.6);
  }

  /* ===== Header / signature element ===== */
  .header{
    padding:28px 24px 22px;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg-deep) 100%);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .avatar-wrap{
    position:relative;
    width:58px;
    height:58px;
    flex:0 0 auto;
  }
  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), var(--teal), var(--gold));
    filter:blur(6px);
    opacity:0.55;
    animation:breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(0.95); opacity:0.4; }
    50%{ transform:scale(1.08); opacity:0.7; }
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-ring{ animation:none; }
  }
  .avatar{
    position:relative;
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--gold-soft), var(--gold));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--bg-deep);
  }
  .header-text{ min-width:0; }
  .header-text h1{
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:20px;
    margin:0 0 4px;
    color:var(--text);
  }
  .header-text p{
    margin:0;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.5;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(255,255,204,0.12);
    border:1px solid rgba(255,255,204,0.4);
    font-size:11px;
    color:var(--gold-soft);
    font-weight:600;
  }
  .badge::before{ content:"★"; font-size:10px; }

  /* ===== Rain drops (3D glass effect, edges only) ===== */
  .header{ position:relative; overflow:hidden; }
  .rain-drop{
    position:absolute;
    top:-20px;
    width:var(--dsize);
    height:calc(var(--dsize) * 1.4);
    border-radius:50% 50% 50% 60% / 60% 60% 40% 40%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.3) 22%, transparent 45%),
      linear-gradient(160deg, #79CBFA 0%, #2C7FC9 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3) inset, 0 2px 6px rgba(0,0,0,0.2);
    opacity:0;
    filter:blur(var(--dblur));
    animation:fall var(--ddur) linear infinite;
    animation-delay:var(--ddelay);
    left:var(--dleft);
  }
  @keyframes fall{
    0%{ transform:translateY(-20px) translateX(0); opacity:0; }
    8%{ opacity:var(--dopac); }
    85%{ opacity:var(--dopac); }
    100%{ transform:translateY(120px) translateX(6px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .rain-drop{ animation:none; opacity:0; }
  }

  /* ===== Periodic sun-ray sweep (near avatar corner) ===== */
  .sun-glow{
    position:absolute;
    top:2px;
    right:6px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,204,0.95) 0%, rgba(255,255,204,0.35) 45%, transparent 72%);
    opacity:0;
    animation:glowpulse 7s ease-in-out infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes glowpulse{
    0%,80%{ opacity:0; transform:scale(0.75); }
    87%{ opacity:0.95; transform:scale(1.15); }
    93%{ opacity:0.95; transform:scale(1); }
    100%{ opacity:0; transform:scale(0.75); }
  }
  @media (prefers-reduced-motion: reduce){
    .sun-glow{ animation:none; opacity:0; }
  }
  .sun-rays{
    position:absolute;
    top:0;
    right:8px;
    width:60px;
    height:92px;
    pointer-events:none;
    z-index:1;
  }
  .ray{
    position:absolute;
    top:-10px;
    width:2.5px;
    height:100px;
    background:linear-gradient(180deg, rgba(255,255,204,0.95) 0%, rgba(255,255,204,0.2) 55%, transparent 100%);
    opacity:0;
    animation:raysweep 7s ease-in-out infinite;
  }
  .ray:nth-child(1){ left:6px;  transform:rotate(20deg); animation-delay:0s; }
  .ray:nth-child(2){ left:22px; transform:rotate(24deg); animation-delay:0.12s; }
  .ray:nth-child(3){ left:38px; transform:rotate(28deg); animation-delay:0.24s; }
  @keyframes raysweep{
    0%, 80%{ opacity:0; }
    87%{ opacity:0.9; }
    93%{ opacity:0.9; }
    100%{ opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .ray{ animation:none; opacity:0; }
  }

  /* ===== Grass strip (only tips peeking, bottom edge) ===== */
  .grass-strip{
    height:11px;
    flex:0 0 auto;
    background-image:
      linear-gradient(45deg, #3FB85B 25%, transparent 25%),
      linear-gradient(-45deg, #35A34E 25%, transparent 25%);
    background-size:14px 22px;
    background-position:0 100%, 7px 100%;
    background-repeat:repeat-x;
    background-color:var(--bg-deep);
  }
  .chat{
    flex:1;
    overflow-y:auto;
    padding:22px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .chat::-webkit-scrollbar{ width:6px; }
  .chat::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

  .msg{
    max-width:80%;
    padding:12px 16px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.65;
    animation:rise 0.25s ease-out;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom-left-radius:6px;
    color:var(--text);
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--gold) 0%, #F2E68C 100%);
    color:var(--bg-deep);
    font-weight:500;
    border-bottom-right-radius:6px;
  }
  .msg.typing{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;
    gap:5px;
    padding:14px 18px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-muted);
    animation:blink 1.2s infinite;
  }
  .dot:nth-child(2){ animation-delay:0.2s; }
  .dot:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:1; } }

  /* ===== Suggested questions ===== */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 20px 16px;
  }
  .chip{
    font-family:inherit;
    font-size:12.5px;
    color:var(--text-muted);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .chip:hover{ border-color:var(--gold); color:var(--gold-soft); }

  /* ===== Input ===== */
  .input-bar{
    display:flex;
    gap:10px;
    padding:16px 18px;
    border-top:1px solid var(--line);
    background:var(--surface);
  }
  .input-bar input{
    flex:1;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    outline:none;
  }
  .input-bar input:focus{ border-color:var(--gold); }
  .input-bar input::placeholder{ color:var(--text-muted); }
  .send-btn{
    width:44px; height:44px;
    border:none;
    border-radius:14px;
    background:var(--gold);
    color:var(--bg-deep);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:filter .15s ease;
  }
  .send-btn:hover{ filter:brightness(1.08); }
  .send-btn:focus-visible, .chip:focus-visible, .input-bar input:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="rain-drop" style="--dsize:7px; --dleft:4%; --ddur:2.6s; --ddelay:0s; --dblur:0px; --dopac:0.95;"></div>
    <div class="rain-drop" style="--dsize:5px; --dleft:9%; --ddur:3.4s; --ddelay:0.8s; --dblur:0px; --dopac:0.85;"></div>
    <div class="rain-drop" style="--dsize:6px; --dleft:91%; --ddur:2.1s; --ddelay:1.4s; --dblur:0px; --dopac:1;"></div>
    <div class="rain-drop" style="--dsize:8px; --dleft:95%; --ddur:3.8s; --ddelay:0.3s; --dblur:0px; --dopac:0.75;"></div>
    <div class="sun-glow"></div>
    <div class="sun-rays">
      <span class="ray"></span>
      <span class="ray"></span>
      <span class="ray"></span>
    </div>
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar">ن</div>
    </div>
    <div class="header-text">
      <h1>تعرّفي على نهى</h1>
      <p>اسأليني عن شخصيتي، اهتماماتي، أو مشاريعي</p>
      <span class="badge">ENFJ-A · البطل</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">أهلًا! أنا هنا أعرّفك على نهى — جربي أي سؤال من الأسفل، أو اكتبي سؤالك الخاص.</div>
  </div>

  <div class="chips" id="chips">
    <button class="chip">من هي نهى؟</button>
    <button class="chip">وش مشاريعها؟</button>
    <button class="chip">وش نمط شخصيتها؟</button>
    <button class="chip">وش تحب تتعلم؟</button>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="اكتبي سؤالك هنا..." />
    <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
  </div>

  <div class="grass-strip" aria-hidden="true"></div>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chips = document.getElementById('chips');

  // ⚠️ عدّلي هذا الرابط لعنوان الـbackend الفعلي (Flask) بعد نشره
  const BACKEND_URL = "/chat";

  function addMessage(text, sender){
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping(){
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping(){
    const t = document.getElementById('typingIndicator');
    if(t) t.remove();
  }

  async function sendMessage(text){
    if(!text.trim()) return;
    addMessage(text, 'user');
    input.value = '';
    showTyping();

    try{
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.answer || 'حصل خطأ، حاولي مرة ثانية.', 'bot');
    } catch(err){
      removeTyping();
      addMessage('ما قدرت أتواصل مع الخادم — تأكدي إن الـbackend شغّال.', 'bot');
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(input.value); });
  chips.addEventListener('click', (e) => {
    if(e.target.classList.contains('chip')) sendMessage(e.target.textContent);
  });
</script>

</body>
</html>
